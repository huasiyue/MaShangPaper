<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <title>MaShangPaper Logo</title>
  <defs>
    <!-- Document Base Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Tech "M" Gradient (Markdown to Word Pipeline) -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14C9C9"/>
      <stop offset="100%" stop-color="#165DFF"/>
    </linearGradient>

    <!-- Graduation Cap Gradients -->
    <linearGradient id="capBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="capBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Layering -->
    <filter id="shadowDoc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowCap" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowFold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ================= THE PAPER DOCUMENT ================= -->
  <!-- Main Document Body -->
  <path d="M 70,40 H 170 L 200,70 V 190 A 10,10 0 0 1 190,200 H 70 A 10,10 0 0 1 60,190 V 50 A 10,10 0 0 1 70,40 Z" 
        fill="url(#docGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadowDoc)"/>
  
  <!-- Folded Corner (Origami Detail) -->
  <path d="M 170,40 L 200,70 L 170,70 Z" fill="#CBD5E1" filter="url(#shadowFold)"/>

  <!-- ================= THE TECH "M" (MaShang / Markdown) ================= -->
  <!-- Bold, modern M representing tech, code, and transformation -->
  <path d="M 90,124 V 82 L 130,112 L 170,82 V 124" 
        fill="none" stroke="url(#mGrad)" stroke-width="14" 
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= THE FORMATTER (Three-Line Thesis Table) ================= -->
  <g stroke-linecap="round">
    <!-- Top Thick Line -->
    <line x1="90" y1="150" x2="170" y2="150" stroke="#334155" stroke-width="4"/>
    <!-- Middle Thin Line -->
    <line x1="90" y1="162" x2="170" y2="162" stroke="#64748B" stroke-width="1.5"/>
    <!-- Bottom Thick Line -->
    <line x1="90" y1="174" x2="170" y2="174" stroke="#334155" stroke-width="4"/>
  </g>

  <!-- Table Data Placeholders -->
  <!-- Headers -->
  <rect x="95" y="153" width="25" height="5" rx="2.5" fill="#94A3B8"/>
  <rect x="135" y="153" width="30" height="5" rx="2.5" fill="#94A3B8"/>
  <!-- Row 1 -->
  <rect x="95" y="166" width="20" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="135" y="166" width="35" height="4" rx="2" fill="#CBD5E1"/>

  <!-- ================= THE ACADEMIC IDENTITY ================= -->
  <!-- Graduation Cap (Mortarboard) anchored on top-left -->
  <g filter="url(#shadowCap)">
    <!-- Base (Skull cap) -->
    <path d="M 52,36 V 55 A 18,8 0 0 0 88,55 V 36 Z" fill="url(#capBaseGrad)"/>
    
    <!-- Diamond Board -->
    <polygon points="70,10 115,28 70,46 25,28" fill="url(#capBoardGrad)" stroke="#1E3A8A" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Center Button -->
    <circle cx="70" cy="28" r="3.5" fill="#172554"/>
    
    <!-- Tassel String -->
    <path d="M 70,28 Q 105,32 110,60" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tassel Knot and Fringe -->
    <circle cx="110" cy="62" r="3" fill="#F59E0B"/>
    <polygon points="110,62 105,76 115,76" fill="#F59E0B" stroke="#D97706" stroke-width="1" stroke-linejoin="round"/>
  </g>

</svg>